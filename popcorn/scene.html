<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popcorn at the Movies</title>
<style>
  @font-face { font-family: Abril;     src: url(fonts/abril.woff2); }
  @font-face { font-family: Elite;     src: url(fonts/elite.woff2); }
  @font-face { font-family: Oswald;    src: url(fonts/oswald700.woff2); font-weight: 700; }
  @font-face { font-family: Oswald;    src: url(fonts/oswald400.woff2); font-weight: 400; }
  @font-face { font-family: Playfair;  src: url(fonts/playfair900.woff2); }
  @font-face { font-family: PlayfairI; src: url(fonts/playfair700i.woff2); }
  @font-face { font-family: Fraktur;   src: url(fonts/fraktur.woff2); }
  @font-face { font-family: Marker;    src: url(fonts/marker.woff2); }
  @font-face { font-family: Bebas;     src: url(fonts/bebas.woff2); }
  @font-face { font-family: OldStd;    src: url(fonts/oldstd.woff2); }
  @font-face { font-family: OldStdB;   src: url(fonts/oldstd700.woff2); }
  html, body { margin: 0; background: #111; overflow: hidden; }
  canvas { display: block; height: 100vh; width: 56.25vh; margin: auto; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script src="cues.js"></script>
<script src="art.js"></script>
<script>
/* =====================================================================
   HOW POPCORN CONQUERED THE MOVIES  newspaper-cutout explainer, 1080x1920 (9:16)
   Every frame is a pure function of t (window.renderAt), so the capture
   script can render it frame-exact. Images come from assets/cut/ (made
   from Pollinations renders by tools/process.py); everything else here
   (paper, type, stamps, marker, fries, flags, motion) is drawn in code.
   ===================================================================== */
const W = 1080, H = 1920, FPS_BOIL = 12;
const cv = document.getElementById('stage'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
window.SCENE_ERRORS = []; window.EVENTS = []; window.fontsReady = false;
window.Sketch = { theme: { paper: '#e9dfc8' } };
addEventListener('error', e => window.SCENE_ERRORS.push(String(e.message)));

const C = window.CUES.lines, TOTAL = window.CUES.total;
window.SCENE = { duration: TOTAL };

/* ---------------------------------------------------------- palette */
const INK = '#1c1816', NEWS = '#efe7d3', CREAM = '#f7f1e3', RED = '#c8231b', KETCHUP = '#b81d16',
      MUSTARD = '#e8b33a', NAVY = '#21396b', KRAFT = '#b88f63', ICE = '#bfdde6', BLUEINK = '#24459c',
      FRBLUE = '#22408f', BEYEL = '#f2c230', USRED = '#b3202a';

/* ---------------------------------------------------------- math */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eInOut = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eBack = u => { const c1 = 2.0, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function rng(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };
function polyPath(x, pts) { x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); }

/* ---------------------------------------------------------- sfx plan */
const EV = [];
const sfx = (t, type, gain = 1, pitch = 1) => { if (t >= 0 && t < TOTAL) EV.push({ t: +t.toFixed(3), type, gain, pitch }); };
const SLAMS = [];

/* ---------------------------------------------------------- paper pieces */
// torn outline around a w x h rectangle; sides not in `sides` are scissor-cut (straight)
function tornPoly(w, h, R, edge = 5, step = 9, sides = 'tblr') {
  const pts = [];
  const side = (x0, y0, x1, y1, torn, nx, ny) => {
    const len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(2, Math.round(len / step));
    for (let i = 0; i < n; i++) {
      const u = i / n, d = torn ? R() * edge : 0;
      pts.push([lerp(x0, x1, u) + nx * d, lerp(y0, y1, u) + ny * d]);
    }
  };
  side(0, 0, w, 0, sides.includes('t'), 0, 1);
  side(w, 0, w, h, sides.includes('r'), -1, 0);
  side(w, h, 0, h, sides.includes('b'), 0, -1);
  side(0, h, 0, 0, sides.includes('l'), 1, 0);
  return pts;
}
function grain(x, w, h, R, n = 0.04, count = null) {
  const k = count || Math.floor(w * h / 90);
  for (let i = 0; i < k; i++) {
    const v = R() < 0.5 ? 0 : 255;
    x.fillStyle = `rgba(${v},${v},${v},${R() * n})`;
    x.fillRect(R() * w, R() * h, 1 + R() * 1.6, 1 + R() * 1.6);
  }
}
// a scrap of paper with a torn (fibrous) edge and a baked drop shadow; content drawn by o.draw
function scrap(w, h, o = {}) {
  const pad = o.pad ?? 42, c = mk(w + pad * 2, h + pad * 2), x = c.getContext('2d'), R = rng(o.seed || 7);
  const sides = o.sides ?? 'tblr', edge = o.edge ?? 6;
  const outer = tornPoly(w, h, R, edge, o.step ?? 8, sides);
  const inner = tornPoly(w, h, R, edge + 3, o.step ?? 8, sides).map(([px, py]) => [px, py]);
  x.translate(pad, pad);
  if (o.shadow !== false) {
    x.save(); x.shadowColor = o.shadowColor || 'rgba(35,22,10,0.42)'; x.shadowBlur = o.blur ?? 18;
    x.shadowOffsetX = o.sx ?? 6; x.shadowOffsetY = o.sy ?? 10; polyPath(x, outer); x.fillStyle = o.color || NEWS; x.fill(); x.restore();
  }
  polyPath(x, outer); x.fillStyle = sides ? (o.rim || '#fbf8f0') : (o.color || NEWS); x.fill();
  x.save(); polyPath(x, sides ? inner : outer); x.clip();
  x.fillStyle = o.color || NEWS; x.fillRect(-10, -10, w + 20, h + 20);
  if (o.texture !== false) {
    const gr = x.createLinearGradient(0, 0, w, h); gr.addColorStop(0, 'rgba(255,255,255,0.10)'); gr.addColorStop(1, 'rgba(60,40,10,0.10)');
    x.fillStyle = gr; x.fillRect(0, 0, w, h); grain(x, w, h, R, o.grain ?? 0.07);
  }
  if (o.draw) o.draw(x, w, h, R);
  x.restore();
  c.pad = pad; return c;
}
// halftone clipping: image + typed caption on newsprint (paper-cut plate from art.js if no render)
const PLATE_AR = { village: 0.62, bridge: 0.6, vendor: 0.78, whitehouse: 0.6, capitol: 0.62, soldiers: 0.62, diner: 0.62, pig: 0.72 };
function clip(name, width, o = {}) {
  const img = IMG[name], plate = !img && window.ART.PLATES[name]; if (!img && !plate) return null;
  const m = o.margin ?? 18, iw = width, ih = img ? img.height * width / img.width : Math.round(width * PLATE_AR[name]), capH = o.caption ? 48 : 0;
  return scrap(iw + m * 2, ih + m * 2 + capH, { seed: o.seed || name.length * 31, color: o.color || NEWS, sides: o.sides, draw(x, w, h) {
    if (img) x.drawImage(img, m, m, iw, ih);
    else { x.save(); x.translate(m, m); x.beginPath(); x.rect(0, 0, iw, ih); x.clip(); plate(x, iw, ih); x.restore(); }
    x.strokeStyle = 'rgba(28,24,22,0.55)'; x.lineWidth = 1.5; x.strokeRect(m, m, iw, ih);
    if (o.caption) { x.fillStyle = INK; x.font = '25px Elite'; x.textAlign = 'center'; x.fillText(o.caption, w / 2, ih + m * 2 + 24); }
  } });
}
// a colour sticker cut-out (already has its own rim from process.py) + baked shadow; drawn carton if no render
function sticker(name, width) {
  const img = IMG[name]; if (!img) return name === 'fries' ? friesCarton(width) : null;
  const pad = 44, h = img.height * width / img.width, c = mk(width + pad * 2, h + pad * 2), x = c.getContext('2d');
  x.shadowColor = 'rgba(35,22,10,0.45)'; x.shadowBlur = 22; x.shadowOffsetX = 8; x.shadowOffsetY = 14;
  x.drawImage(img, pad, pad, width, h); c.pad = pad; return c;
}
function friesCarton(width) {
  const k = width / 500, w = 500, h = 640, pad = 50, c = mk(w * k + pad * 2, h * k + pad * 2), x = c.getContext('2d'), R = rng(5);
  const art = mk(w, h), a = art.getContext('2d');
  const sticks = [];
  for (let i = 0; i < 17; i++) sticks.push([110 + i * 17 + (R() - 0.5) * 14, 40 + R() * 120, (R() - 0.5) * 0.5]);
  const carton = () => { a.beginPath(); a.moveTo(70, 270); a.quadraticCurveTo(250, 330, 430, 270); a.lineTo(380, 630); a.lineTo(120, 630); a.closePath(); };
  // white sticker rim: draw everything fat in cream first
  const drawAll = (rim) => {
    sticks.forEach(([sx, sy, r]) => { a.save(); a.translate(sx, sy + 200); a.rotate(r); a.fillStyle = rim || '#efb53f';
      if (rim) { a.beginPath(); a.roundRect(-24, -224, 48, 328, 14); a.fill(); }
      else { const gr = a.createLinearGradient(-16, 0, 16, 0); gr.addColorStop(0, '#f9d46b'); gr.addColorStop(0.6, '#efb53f'); gr.addColorStop(1, '#c9822a'); a.fillStyle = gr; a.beginPath(); a.roundRect(-16, -210, 32, 300, 6); a.fill(); a.fillStyle = 'rgba(140,70,10,0.45)'; a.fillRect(-16, -210, 32, 10); }
      a.restore(); });
    if (rim) { a.save(); a.lineWidth = 30; a.strokeStyle = rim; a.lineJoin = 'round'; carton(); a.stroke(); a.fillStyle = rim; a.fill(); a.restore(); }
  };
  drawAll('#fbf8f0'); drawAll(null);
  const gr = a.createLinearGradient(70, 0, 430, 0); gr.addColorStop(0, '#9c1812'); gr.addColorStop(0.45, '#d42a1f'); gr.addColorStop(1, '#a51a13');
  a.fillStyle = gr; carton(); a.fill();
  a.fillStyle = '#f3ead2'; a.beginPath(); a.moveTo(98, 330); a.quadraticCurveTo(250, 380, 402, 330); a.lineTo(399, 352); a.quadraticCurveTo(250, 402, 101, 352); a.fill();
  a.font = '86px Abril'; a.textAlign = 'center'; a.fillStyle = '#f3ead2'; a.fillText('FRITES', 250, 500);
  a.font = '24px Elite'; a.fillText('SINCE 17\u2014?', 250, 548);
  window.ART.screen(a, w, h, 0.12, 7);
  x.shadowColor = 'rgba(35,22,10,0.45)'; x.shadowBlur = 22; x.shadowOffsetX = 8; x.shadowOffsetY = 14;
  x.drawImage(art, pad, pad, w * k, h * k); c.pad = pad; return c;
}
function textScrap(text, o = {}) {
  const font = o.font || '64px Abril', mx = o.mx ?? 26, my = o.my ?? 14;
  const t = mk(10, 10).getContext('2d'); t.font = font; const tw = t.measureText(text).width;
  const size = parseFloat(font.match(/(\d+)px/)[1]);
  const w = tw + mx * 2, h = size * (o.lh ?? 1.05) + my * 2;
  return scrap(w, h, { seed: o.seed || text.length * 7 + 3, color: o.bg || CREAM, sides: o.sides, edge: o.edge, blur: o.blur, draw(x) {
    x.font = font; x.fillStyle = o.fg || INK; x.textBaseline = 'middle'; x.textAlign = 'center';
    x.fillText(text, w / 2, h / 2 + size * (o.baseline ?? 0.06));
  } });
}
// typed label strip (text typed in dynamically)
function labelStrip(text, size = 28) {
  const t = mk(10, 10).getContext('2d'); t.font = `${size}px Elite`;
  const w = t.measureText(text).width + 36, h = size + 22;
  const c = scrap(w, h, { seed: text.length * 13 + 5, color: '#fbf7ec', sides: 'lr', edge: 4, blur: 10, sy: 5, sx: 3 });
  c.tw = w; c.th = h; return c;
}
// rubber stamp (draw with multiply)
function stamp(text, color, size = 120) {
  const t = mk(10, 10).getContext('2d'); t.font = `${size}px Bebas`;
  const tw = t.measureText(text).width, w = tw + size * 0.75, h = size * 1.25, pad = 14;
  const c = mk(w + pad * 2, h + pad * 2), x = c.getContext('2d'), R = rng(text.length * 97 + size);
  x.translate(pad, pad); x.strokeStyle = color; x.fillStyle = color;
  x.lineWidth = size * 0.07; x.beginPath(); x.roundRect(0, 0, w, h, size * 0.12); x.stroke();
  x.lineWidth = size * 0.025; x.beginPath(); x.roundRect(size * 0.11, size * 0.11, w - size * 0.22, h - size * 0.22, size * 0.07); x.stroke();
  x.font = `${size}px Bebas`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w / 2, h / 2 + size * 0.05);
  // rubber texture: knock out specks and a few dry streaks
  x.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < w * h / 26; i++) { x.globalAlpha = R() * 0.8; x.fillRect(R() * w, R() * h, 1 + R() * 3, 1 + R() * 3); }
  x.globalAlpha = 0.5; for (let i = 0; i < 9; i++) { const yy = R() * h; x.fillRect(R() * w * 0.5, yy, w * (0.2 + R() * 0.5), 1 + R() * 2); }
  c.pad = pad; return c;
}
// ransom-note word: every letter its own clipping
const LFONTS = [['Abril', 1, 0], ['Oswald', 1, 700], ['Playfair', 1, 0], ['Bebas', 1.15, 0], ['OldStdB', 1, 0], ['Elite', 1, 0], ['PlayfairI', 1, 0]];
const SWATCH = [[CREAM, INK], [INK, CREAM], [RED, CREAM], [MUSTARD, INK], ['#fbf6ea', RED], [NAVY, CREAM], ['#d8ccb0', INK], ['#fffaf0', INK]];
function ransom(word, size, seed) {
  const R = rng(seed), letters = []; let x = 0;
  const t = mk(10, 10).getContext('2d');
  for (const ch of word) {
    if (ch === ' ') { x += size * 0.32; continue; }
    const [fam, k, wt] = LFONTS[Math.floor(R() * LFONTS.length)], sw = SWATCH[Math.floor(R() * SWATCH.length)];
    const fs = size * k * (0.9 + R() * 0.22), font = `${wt ? wt + ' ' : ''}${fs}px ${fam}`;
    t.font = font; const tw = t.measureText(ch).width;
    const w = Math.max(tw + size * 0.24, size * 0.42), h = size * 1.12;
    const c = scrap(w, h, { seed: Math.floor(R() * 1e6), color: sw[0], sides: R() < 0.5 ? 'tblr' : 'tb', edge: 4, step: 6, blur: 8, sx: 3, sy: 5, pad: 20, draw(xx) {
      xx.font = font; xx.fillStyle = sw[1]; xx.textAlign = 'center'; xx.textBaseline = 'middle'; xx.fillText(ch, w / 2, h / 2 + fs * 0.06);
    } });
    letters.push({ c, x: x + w / 2, dy: (R() - 0.5) * size * 0.14, rot: (R() - 0.5) * 0.2 });
    x += w - size * 0.04;
  }
  return { letters, w: x, h: size * 1.12 };
}
// golden fry stick sticker
function fry(len, seed) {
  const R = rng(seed), th = 30 + R() * 8, pad = 24, c = mk(len + pad * 2, th + pad * 2), x = c.getContext('2d');
  x.translate(pad, pad);
  x.save(); x.shadowColor = 'rgba(40,20,0,0.4)'; x.shadowBlur = 10; x.shadowOffsetY = 6;
  x.fillStyle = '#fbf6ea'; x.beginPath(); x.roundRect(-6, -6, len + 12, th + 12, 10); x.fill(); x.restore();
  const gr = x.createLinearGradient(0, 0, 0, th); gr.addColorStop(0, '#f9d46b'); gr.addColorStop(0.5, '#efb53f'); gr.addColorStop(1, '#c9822a');
  x.fillStyle = gr; x.beginPath(); x.roundRect(0, 0, len, th, 6); x.fill();
  const tip = x.createLinearGradient(0, 0, len, 0); tip.addColorStop(0, 'rgba(140,70,10,0.55)'); tip.addColorStop(0.08, 'rgba(140,70,10,0)');
  tip.addColorStop(0.92, 'rgba(140,70,10,0)'); tip.addColorStop(1, 'rgba(140,70,10,0.55)'); x.fillStyle = tip; x.fillRect(0, 0, len, th);
  for (let i = 0; i < len / 6; i++) { x.fillStyle = `rgba(150,80,20,${R() * 0.35})`; x.fillRect(R() * len, R() * th, 2, 2); }
  x.fillStyle = 'rgba(255,255,255,0.35)'; x.fillRect(4, 4, len - 8, 3);
  c.pad = pad; return c;
}
// flag made of torn paper strips
function flagStrips(cols, w, h, vertical = true, seed = 1) {
  const pad = 40, c = mk(w + pad * 2, h + pad * 2), x = c.getContext('2d');
  cols.forEach((col, i) => {
    const sw = vertical ? w / cols.length : w, sh = vertical ? h : h / cols.length;
    const s = scrap(sw + 6, sh + 6, { seed: seed * 10 + i, color: col, edge: 6, blur: 10, sy: 6, pad: 30 });
    x.drawImage(s, pad - 30 + (vertical ? i * sw : 0) - 3, pad - 30 + (vertical ? 0 : i * sh) - 3);
  });
  c.pad = pad; return c;
}

/* ---------------------------------------------------------- marker pen */
function strokeLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }
function markerPath(pts, p, o = {}) {
  if (p <= 0) return;
  const L = strokeLen(pts) * clamp(p); let acc = 0;
  g.save(); g.globalCompositeOperation = 'multiply'; g.strokeStyle = o.color || RED; g.lineWidth = o.w || 10;
  g.lineCap = 'round'; g.lineJoin = 'round'; g.globalAlpha *= o.alpha ?? 0.92;
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (acc + d > L) { const u = (L - acc) / d; g.lineTo(lerp(pts[i - 1][0], pts[i][0], u), lerp(pts[i - 1][1], pts[i][1], u)); break; }
    g.lineTo(pts[i][0], pts[i][1]); acc += d;
  }
  g.stroke(); g.restore();
}
function ovalPts(cx, cy, rx, ry, seed, turns = 1.12) {
  const R = rng(seed), pts = [], n = 90, a0 = -2.2 + R() * 0.4;
  for (let i = 0; i <= n; i++) {
    const u = i / n, a = a0 + u * turns * Math.PI * 2, wob = 1 + (R() - 0.5) * 0.025 + u * 0.06;
    pts.push([cx + Math.cos(a) * rx * wob, cy + Math.sin(a) * ry * wob]);
  }
  return pts;
}
function linePts(x0, y0, x1, y1, seed, bow = 8) {
  const R = rng(seed), pts = [], n = 24, b = (R() - 0.5) * bow * 2;
  for (let i = 0; i <= n; i++) { const u = i / n; pts.push([lerp(x0, x1, u), lerp(y0, y1, u) + Math.sin(u * Math.PI) * b + (R() - 0.5) * 1.5]); }
  return pts;
}
function curvePts(x0, y0, cx, cy, x1, y1, n = 40) {
  const pts = []; for (let i = 0; i <= n; i++) { const u = i / n, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u; pts.push([a * x0 + b * cx + c * x1, a * y0 + b * cy + c * y1]); } return pts;
}
function arrowHead(pts, p, o = {}) {
  if (p < 1) return;
  const n = pts.length, [x1, y1] = pts[n - 1], [x0, y0] = pts[n - 4], a = Math.atan2(y1 - y0, x1 - x0), L = o.head || 34;
  markerPath([[x1 - Math.cos(a - 0.5) * L, y1 - Math.sin(a - 0.5) * L], [x1, y1], [x1 - Math.cos(a + 0.5) * L, y1 - Math.sin(a + 0.5) * L]], 1, o);
}
function markerText(text, x, y, size, p, o = {}) {
  if (p <= 0) return;
  g.save(); g.font = `${size}px Marker`; const tw = g.measureText(text).width;
  g.beginPath(); g.rect(x - 20, y - size * 1.2, (tw + 40) * clamp(p), size * 2); g.clip();
  g.globalCompositeOperation = 'multiply'; g.fillStyle = o.color || RED; g.textBaseline = 'middle';
  g.translate(x, y); g.rotate(o.rot || 0); g.fillText(text, 0, 0); g.restore();
}

/* ---------------------------------------------------------- items / animation */
function boil(key, amt = 1) {                 // stop-motion wiggle, 12 steps per second
  const s = Math.floor(T_NOW * FPS_BOIL);
  return [(hash(key * 7.13 + s) - 0.5) * 2.2 * amt, (hash(key * 3.71 + s * 1.3) - 0.5) * 2.2 * amt, (hash(key * 1.97 + s * 0.7) - 0.5) * 0.007 * amt];
}
const ANIM = {
  pop:   u => { const e = eBack(clamp(u / 0.38)); return { s: lerp(0.55, 1, e), a: clamp(u / 0.1), rot: (1 - e) * 0.18 }; },
  slideR: u => { const e = eOut(clamp(u / 0.55)); return { dx: (1 - e) * 1500, rot: (1 - e) * 0.25, a: 1 }; },
  slideL: u => { const e = eOut(clamp(u / 0.55)); return { dx: -(1 - e) * 1500, rot: -(1 - e) * 0.25, a: 1 }; },
  slideU: u => { const e = eOut(clamp(u / 0.6)); return { dy: (1 - e) * 1200, rot: (1 - e) * 0.1, a: 1 }; },
  drop:  u => { const e = eBack(clamp(u / 0.45)); return { dy: -(1 - e) * 1100, rot: (1 - e) * -0.3, a: 1 }; },
  slam:  u => { const e = eIn(clamp(u / 0.16)); return { s: lerp(2.3, 1, e), a: clamp(u / 0.06), rot: 0 }; },
  none:  () => ({}),
};
const EXIT = {
  slideD: u => { const e = eIn(clamp(u / 0.5)); return { dy: e * 1300, rot: e * 0.3 }; },
  fade:   u => ({ a: 1 - clamp(u / 0.4) }),
};
const ANIM_SFX = { pop: ['pop', 0.6, 1], slideR: ['swish', 0.8, 1], slideL: ['swish', 0.8, 1], slideU: ['swish', 0.8, 0.9], drop: ['thud', 0.9, 1], slam: ['thud', 1.2, 0.85] };

let T_NOW = 0;
function drawCanvasAt(c, x, y, rot, s, alpha, key, bw = 1, comp) {

function burst(t0, x, y, n = 14, spread = 1) {            // popcorn bursting upward; an item so it can sit behind type

      drawCanvasAt(PC[i % PC.length], px, py, u * (hash(i) - 0.5) * 10, clamp(u / 0.08) * (0.8 + hash(i + t0 * 3) * 0.7), 1, 600 + i, 0.5);

let TICKETS = [];

/* ---------------------------------------------------------- captions */
const CAPS = window.CAPS || [];
const CAP_C = new Map();
function capStrip(text, i) {
  if (CAP_C.has(i)) return CAP_C.get(i);
  const t = mk(10, 10).getContext('2d'); t.font = '700 50px Oswald'; const tw = t.measureText(text).width;
  const c = scrap(tw + 56, 84, { seed: 900 + i, color: i % 2 ? '#fbf6ea' : CREAM, sides: 'lr', edge: 5, blur: 12, sy: 6, draw(x, w, h) {
    x.font = '700 50px Oswald'; x.fillStyle = INK; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w / 2, h / 2 + 3);
  } });
  CAP_C.set(i, c); return c;
}
function drawCaptions(t) {
  const i = CAPS.findIndex(([a, b]) => t >= a && t < b + 0.12); if (i < 0) return;
  const [a] = CAPS[i], u = t - a, e = eBack(clamp(u / 0.18));

/* ---------------------------------------------------------- frame */
const CAM = [[1.0, 1.04, 0, 12], [1.02, 1.0, 10, -10], [1.0, 1.04, 0, -12], [1.03, 1.0, -8, 8], [1.0, 1.05, 0, 0], [1.0, 1.035, 6, -10], [1.0, 1.04, 0, 8], [1.0, 1.05, 0, 0], [1.03, 1.0, 0, -6]];
const BGOFF = [[200, 160], [420, 80], [100, 300], [500, 260], [260, 40], [380, 330], [80, 120], [460, 200], [300, 250]];
function shake(t) {
  let x = 0, y = 0;
  for (const s of SLAMS) { const d = t - s; if (d < 0 || d > 0.4) continue; const a = 9 * Math.exp(-d * 11); x += Math.sin(d * 70) * a; y += Math.cos(d * 55) * a * 0.7; }
  return [x, y];
}
function render(t) {
  T_NOW = t;
  const si = SCENES.findIndex(s => t >= s.start && t < s.end), sc = SCENES[si < 0 ? SCENES.length - 1 : si];
  const lt = (t - sc.start) / Math.max(1, sc.end - sc.start), [z0, z1, dx, dy] = CAM[sc.i], z = lerp(z0, z1, eInOut(clamp(lt)));
  const [shx, shy] = shake(t);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  const [bx, by] = BGOFF[sc.i];
  g.save(); g.translate(W / 2 + shx * 0.5, H / 2 + shy * 0.5); g.scale(1 + (z - 1) * 0.5, 1 + (z - 1) * 0.5); g.translate(-W / 2 - bx - dx * lt * 0.5, -H / 2 - by - dy * lt * 0.5);
  g.drawImage(BG, 0, 0); g.restore();
  g.save(); g.translate(W / 2 + shx, H / 2 + shy); g.scale(z, z); g.translate(-W / 2 + dx * lt, -H / 2 + dy * lt);
  for (const it of sc.items) drawItem(it, t);
  g.restore();
  TR.forEach((T, i) => {

    });

  g.drawImage(VIGNETTE, 0, 0);

}
let WIPES = [];
function buildWipes() {
  WIPES = [];
  TR.forEach((T, i) => WIPE_COL[i].forEach((col, k) => {

/* ---------------------------------------------------------- boot */
const ASSETS = ['corn', 'cart', 'palace', 'crowd', 'concession', 'dig'];

(async () => {
  try {

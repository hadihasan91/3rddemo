<!doctype html>

<meta charset="utf-8">
<title>Why the Bottle Curves</title>
<style>
  @font-face { font-family: 'Anton'; src: url(fonts/Anton.woff2) format('woff2'); }
  @font-face { font-family: 'Playfair Display'; src: url(fonts/PlayfairDisplay.woff2) format('woff2'); font-weight: 400 900; }

<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script src="cues.js"></script>
<script>
'use strict';
/* =====================================================================================
   WHY THE BOTTLE CURVES — newspaper cutout / mixed media explainer, 1080x1920 @ 30fps
   Everything is drawn procedurally: halftone vessels, ransom type, stamps, torn paper.
   renderAt(t) is pure for a given t, so frames can be captured in any order.
   ===================================================================================== */
window.SCENE_ERRORS = [];
window.addEventListener('error', e => window.SCENE_ERRORS.push(String(e.message)));

const W = 1080, H = 1920;
const cv = document.getElementById('stage');
const g = cv.getContext('2d');
const C = CUES.lines, TOTAL = CUES.total;
const VIDEO = /video=1/.test(location.search);

/* ------------------------------------------------------------------ palette */
const P = {
  paper: '#ECE2CC', news: '#F2ECDD', ink: '#1C1A17', ink2: '#3A352E', red: '#C9202C', red2: '#951520',
  kraft: '#BE9867', white: '#FBF8F0', cream: '#F3E8C8', dark: '#141210',
  green: '#9EC1A6', greenDot: '#1E3226', cola: '#4A3424', colaDot: '#140D09', amber: '#D2A15E', amberDot: '#3B2210',
  aqua: '#BFD8D2', aquaDot: '#284440', pod: '#D59A45', podDot: '#4A2610', clear: '#DDE7E3', clearDot: '#41504B',
  tape: 'rgba(238,228,188,0.78)', blue: '#7FA9B8',
};

/* ------------------------------------------------------------------ math + timing */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const eio = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eout = u => 1 - Math.pow(1 - u, 3);
const ein = u => u * u * u;
const eback = u => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const at = id => C[id].at, en = id => C[id].end;
// time a word is spoken, estimated from its character position in the line
function wordAt(id, word, occ = 0) {
  const L = C[id], s = L.text.toLowerCase(); let i = -1;
  for (let k = 0; k <= occ; k++) i = s.indexOf(word.toLowerCase(), i + 1);
  if (i < 0) throw new Error(`word "${word}" not in line ${id}`);
  return L.at + L.dur * (i / s.length);
}
// stop-motion: everything "boils" on twelves
let TICK = 0;
function jit(key, amp = 1) { const r = rng((key * 9973 + TICK * 31337) >>> 0); return [(r() - 0.5) * 2 * amp, (r() - 0.5) * 2 * amp, (r() - 0.5) * 2]; }

/* ------------------------------------------------------------------ sfx timeline (read by sfx.mjs) */
const EVENTS = [];
const ev = (t, type, gain = 1, pitch = 1) => EVENTS.push({ t: +t.toFixed(3), type, gain, pitch });

/* ------------------------------------------------------------------ offscreen helpers */
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
const CACHE = new Map();
function cached(key, fn) { if (!CACHE.has(key)) CACHE.set(key, fn()); return CACHE.get(key); }

// Paper: base colour + fine noise + fibres + soft blotches
function makePaper(w, h, base, seed, { noise = 14, fibers = 500, blotch = 10, dark = false } = {}) {
  const c = mk(w, h), x = c.getContext('2d'), r = rng(seed);
  x.fillStyle = base; x.fillRect(0, 0, w, h);
  for (let i = 0; i < blotch; i++) {
    const bx = r() * w, by = r() * h, br = 120 + r() * 420;
    const gr = x.createRadialGradient(bx, by, 0, bx, by, br);
    const a = 0.03 + r() * 0.05;
    gr.addColorStop(0, dark ? `rgba(255,255,255,${a * 0.4})` : `rgba(120,90,40,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr; x.fillRect(bx - br, by - br, br * 2, br * 2);
  }
  const id = x.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * noise; d[i] += n; d[i + 1] += n; d[i + 2] += n * 0.9; }
  x.putImageData(id, 0, 0);
  x.lineCap = 'round';
  for (let i = 0; i < fibers; i++) {
    const fx = r() * w, fy = r() * h, a = r() * Math.PI * 2, l = 6 + r() * 26;
    x.strokeStyle = dark ? `rgba(255,255,255,${0.02 + r() * 0.04})` : `rgba(90,70,40,${0.04 + r() * 0.08})`; x.lineWidth = 0.6 + r() * 0.8;
    x.beginPath(); x.moveTo(fx, fy); x.quadraticCurveTo(fx + Math.cos(a + 0.6) * l * 0.5, fy + Math.sin(a + 0.6) * l * 0.5, fx + Math.cos(a) * l, fy + Math.sin(a) * l); x.stroke();
  }
  return c;
}

// Faux newspaper columns (period ad copy), drawn on transparent so it can be laid over any paper
const WORDS = ('the and of a to in delicious refreshing pure tonic soda fountain atlanta drug store glass cents sold every druggist ' +
  'invigorating relieves fatigue cool sparkling sold here bottled carbonated syrup nerve brain famous genuine accept no substitutes ' +
  'imitations beware ask for it by name served cold ice parlor sundries patent new improved family wholesale retail orders filled').split(' ');
function makeNews(w, h, seed, { masthead = null, date = '', cols = 4, alpha = 0.55, top = 0 } = {}) {
  const c = mk(w, h), x = c.getContext('2d'), r = rng(seed);
  x.fillStyle = P.ink; x.globalAlpha = alpha;
  let y0 = 70 + top;
  if (masthead) {
    x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    x.font = `400 96px UnifrakturMaguntia`; x.fillText(masthead, w / 2, y0 + 80);
    x.fillRect(50, y0 + 104, w - 100, 4); x.fillRect(50, y0 + 112, w - 100, 1.5);
    x.font = `400 22px 'Old Standard TT'`; x.textAlign = 'left'; x.fillText('VOL. I', 56, y0 + 140);
    x.textAlign = 'center'; x.fillText(date, w / 2, y0 + 140); x.textAlign = 'right'; x.fillText('PRICE FIVE CENTS', w - 56, y0 + 140);
    x.fillRect(50, y0 + 152, w - 100, 1.5); y0 += 180;
  }
  const gut = 26, cw = (w - 100 - gut * (cols - 1)) / cols;
  x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  for (let ci = 0; ci < cols; ci++) {
    const cx = 50 + ci * (cw + gut); let y = y0 + r() * 20;
    if (ci) { x.fillRect(cx - gut / 2, y0, 1, h - y0 - 40); }
    while (y < h - 50) {
      if (r() < 0.12) { // headline block
        x.font = `700 ${26 + Math.floor(r() * 10)}px 'Old Standard TT'`;
        const words = []; for (let k = 0; k < 2 + Math.floor(r() * 2); k++) words.push(WORDS[Math.floor(r() * WORDS.length)].toUpperCase());
        y += 34; x.textAlign = 'center'; x.fillText(words.join(' ').slice(0, 22), cx + cw / 2, y); x.textAlign = 'left';
        y += 10; x.fillRect(cx + cw * 0.3, y, cw * 0.4, 1); y += 14;
      }
      x.font = `400 15px 'Old Standard TT'`;
      const n = 3 + Math.floor(r() * 9);
      for (let li = 0; li < n && y < h - 50; li++) {
        let s = ''; while (x.measureText(s).width < cw - 30) s += WORDS[Math.floor(r() * WORDS.length)] + ' ';
        y += 19; x.fillText(li === n - 1 ? s.slice(0, Math.floor(s.length * (0.3 + r() * 0.5))) : s.trim(), cx, y);
      }
      y += 12;
    }
  }
  return c;
}

// Grain frames (stop-motion flicker), soft
const GRAIN = [];
function makeGrain() {
  for (let k = 0; k < 4; k++) {
    const c = mk(540, 960), x = c.getContext('2d'), id = x.createImageData(540, 960), d = id.data, r = rng(900 + k);
    for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    x.putImageData(id, 0, 0);
    // a couple of dust specks and hairs
    for (let i = 0; i < 18; i++) { x.fillStyle = r() < 0.5 ? '#000' : '#fff'; x.beginPath(); x.arc(r() * 540, r() * 960, 0.6 + r() * 1.6, 0, 7); x.fill(); }
    x.strokeStyle = 'rgba(0,0,0,0.9)'; x.lineWidth = 0.8;
    if (k % 2) { x.beginPath(); const hx = r() * 540, hy = r() * 960; x.moveTo(hx, hy); x.bezierCurveTo(hx + 20, hy - 10, hx + 10, hy + 30, hx + 35, hy + 25); x.stroke(); }
    GRAIN.push(c);
  }
}

/* ------------------------------------------------------------------ cut paper primitives */
// jagged polygon around a rectangle (torn on chosen sides)
function tornRectPoly(w, h, seed, { torn = 'tblr', amp = 7, step = 14 } = {}) {
  const r = rng(seed), pts = [];
  const side = (x0, y0, x1, y1, isTorn) => {
    const L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.round(L / step)), nx = -(y1 - y0) / L, ny = (x1 - x0) / L;
    for (let i = 0; i < n; i++) { const u = i / n, o = isTorn ? (r() - 0.5) * 2 * amp : (r() - 0.5) * 1.2; pts.push([x0 + (x1 - x0) * u + nx * o, y0 + (y1 - y0) * u + ny * o]); }
  };
  side(0, 0, w, 0, torn.includes('t')); side(w, 0, w, h, torn.includes('r')); side(w, h, 0, h, torn.includes('b')); side(0, h, 0, 0, torn.includes('l'));
  return pts;
}
function polyPath(x, pts) { x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); }

// Generic cutout: draws content, dilates it into a white paper border, adds a soft drop shadow.
function makeCut(w, h, draw, { border = 12, seed = 1, shadow = true, edge = P.white, pad = 40 } = {}) {
  const PW = w + pad * 2, PH = h + pad * 2;
  const c1 = mk(PW, PH), x1 = c1.getContext('2d'); x1.translate(pad, pad); draw(x1, w, h);
  const c2 = mk(PW, PH), x2 = c2.getContext('2d'), r = rng(seed);
  if (border > 0) {
    for (let k = 0; k < 28; k++) { const a = k / 28 * Math.PI * 2, b = border * (0.86 + r() * 0.28); x2.drawImage(c1, Math.cos(a) * b, Math.sin(a) * b); }
    x2.globalCompositeOperation = 'source-in'; x2.fillStyle = edge; x2.fillRect(0, 0, PW, PH);
    x2.globalCompositeOperation = 'source-over';
  }
  x2.drawImage(c1, 0, 0);
  const out = mk(PW, PH), xo = out.getContext('2d');
  if (shadow) {
    const s = mk(PW, PH), xs = s.getContext('2d');
    xs.filter = 'blur(7px)'; xs.drawImage(c2, 0, 0); xs.filter = 'none';
    xs.globalCompositeOperation = 'source-in'; xs.fillStyle = 'rgba(20,12,4,0.42)'; xs.fillRect(0, 0, PW, PH);
    xo.drawImage(s, 5, 10);
  }
  xo.drawImage(c2, 0, 0);
  return { c: out, w: PW, h: PH, pad };
}
// place a cutout centred at x,y (with stop-motion boil)
function place(cut, x, y, { rot = 0, scale = 1, alpha = 1, key = 0, boil = 1.2, sx = 1, sy = 1 } = {}) {
  if (alpha <= 0.001 || scale <= 0.001) return;
  const [jx, jy, jr] = jit(key, boil);
  g.save(); g.globalAlpha *= alpha; g.translate(x + jx, y + jy); g.rotate(rot + jr * 0.004 * boil); g.scale(scale * sx, scale * sy);
  g.drawImage(cut.c, -cut.w / 2, -cut.h / 2); g.restore();
}

// torn paper strip / panel (cached)
function strip(w, h, color, seed, opts = {}) {
  return cached(`strip:${w}:${h}:${color}:${seed}:${opts.torn || 'tblr'}`, () => {
    const pts = tornRectPoly(w, h, seed, opts);
    const tex = opts.tex ? cached(`tex:${color}`, () => makePaper(400, 400, color, 77, { noise: 18, fibers: 120, blotch: 2 })) : null;
    return makeCut(w, h, (x) => {
      polyPath(x, pts); x.fillStyle = color; x.fill();
      if (tex) { x.save(); polyPath(x, pts); x.clip(); x.globalAlpha = 0.9; for (let yy = 0; yy < h; yy += 400) for (let xx = 0; xx < w; xx += 400) x.drawImage(tex, xx, yy); x.restore(); }
      if (opts.draw) opts.draw(x, w, h);
    }, { border: 0, seed, shadow: opts.shadow !== false });
  });
}
// masking tape
function tape(x, y, w, rot, key) {
  const c = cached(`tape:${Math.round(w)}:${key}`, () => {
    const h = 44, pts = tornRectPoly(w, h, key + 5, { torn: 'lr', amp: 5, step: 7 });
    const cc = mk(w + 20, h + 20), xx = cc.getContext('2d'); xx.translate(10, 10);
    polyPath(xx, pts); xx.fillStyle = P.tape; xx.fill();
    xx.globalAlpha = 0.15; xx.strokeStyle = '#9b8f63'; for (let i = 0; i < w; i += 5) { xx.beginPath(); xx.moveTo(i, 2); xx.lineTo(i + 3, h - 2); xx.stroke(); }
    return cc;
  });
  const [jx, jy] = jit(key, 0.8);
  g.save(); g.translate(x + jx, y + jy); g.rotate(rot); g.drawImage(c, -c.width / 2, -c.height / 2); g.restore();
}

/* ------------------------------------------------------------------ halftone */
// dots on a 45° grid; darkFn(x, y) returns 0..1 darkness (or <0 to skip)
function halftone(x, bx, by, bw, bh, sp, darkFn, color, ang = Math.PI / 4, maxR = 0.66) {
  const ca = Math.cos(ang), sa = Math.sin(ang), cx = bx + bw / 2, cy = by + bh / 2, R = Math.hypot(bw, bh) / 2 + sp;
  const n = Math.ceil(R / sp);
  x.beginPath();
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
    const px = cx + (i * ca - j * sa) * sp, py = cy + (i * sa + j * ca) * sp;
    if (px < bx - sp || px > bx + bw + sp || py < by - sp || py > by + bh + sp) continue;
    const d = darkFn(px, py); if (d <= 0) continue;
    const rr = sp * maxR * Math.sqrt(Math.min(1.2, d)); if (rr < 0.45) continue;
    x.moveTo(px + rr, py); x.arc(px, py, rr, 0, Math.PI * 2);
  }
  x.fillStyle = color; x.fill();
}
// red halftone burst disc (behind heroes)
function burst(r, color, seed) {
  return cached(`burst:${r}:${color}:${seed}`, () => {
    const c = mk(r * 2, r * 2), x = c.getContext('2d');
    halftone(x, 0, 0, r * 2, r * 2, 15, (px, py) => { const d = Math.hypot(px - r, py - r) / r; return d > 1 ? -1 : Math.pow(1 - d, 0.8) * 1.1; }, color, 0.3, 0.7);
    return c;
  });
}

/* ------------------------------------------------------------------ vessels (bottles, glass, pod) */
const NS = 240;
function profile(pts, smoothPasses = 4) {
  const R = new Float32Array(NS + 1);
  for (let i = 0; i <= NS; i++) {
    const y = i / NS; let k = 0; while (k < pts.length - 2 && pts[k + 1][0] < y) k++;
    const [y0, r0] = pts[k], [y1, r1] = pts[k + 1]; R[i] = lerp(r0, r1, clamp((y - y0) / (y1 - y0 || 1)));
  }
  for (let p = 0; p < smoothPasses; p++) { const T = R.slice(); for (let i = 1; i < NS; i++) R[i] = (T[i - 1] + 2 * T[i] + T[i + 1]) / 4; }
  return R;
}
const PROF = {
  contour: profile([[0, .31], [.012, .345], [.032, .345], [.045, .30], [.10, .285], [.17, .30], [.24, .40], [.30, .62], [.35, .80], [.42, .855], [.49, .80], [.555, .72], [.62, .86], [.70, .985], [.78, .93], [.86, .80], [.93, .80], [.975, .83], [.995, .80], [1, .74]]),
  proto: profile([[0, .26], [.012, .29], [.032, .29], [.045, .25], [.10, .24], [.17, .26], [.24, .36], [.31, .64], [.37, .80], [.45, .86], [.52, .82], [.58, .86], [.66, 1.0], [.76, .97], [.86, .74], [.93, .60], [.975, .60], [.995, .58], [1, .54]]),
  pet: profile([[0, .34], [.04, .34], [.045, .40], [.06, .40], [.065, .31], [.13, .30], [.21, .36], [.29, .62], [.35, .80], [.42, .84], [.49, .79], [.55, .72], [.62, .85], [.70, .97], [.78, .92], [.86, .80], [.94, .82], [.985, .84], [1, .72]]),
  straight: profile([[0, .30], [.012, .34], [.032, .34], [.045, .29], [.12, .28], [.20, .30], [.27, .48], [.33, .80], [.38, .94], [.44, 1.0], [.97, 1.0], [.995, .97], [1, .92]], 3),
  hutch: profile([[0, .40], [.02, .46], [.06, .46], [.08, .38], [.15, .36], [.22, .42], [.28, .74], [.33, .94], [.38, 1.0], [.97, 1.0], [.995, .96], [1, .92]], 3),
  glass: profile([[0, 1.0], [.04, .97], [.30, .80], [.55, .55], [.66, .34], [.72, .20], [.84, .17], [.90, .30], [.96, .56], [1, .58]], 3),
  pod: profile([[0, .04], [.04, .14], [.12, .42], [.25, .74], [.42, .96], [.55, 1.0], [.68, .92], [.82, .66], [.93, .34], [.985, .10], [1, .02]], 3),
};
function mixProf(A, B, u) { const R = new Float32Array(NS + 1); for (let i = 0; i <= NS; i++) R[i] = lerp(A[i], B[i], u); return R; }
function vPath(x, R, cx, top, h, w, pad = 0) {
  x.beginPath();
  for (let i = 0; i <= NS; i++) x.lineTo(cx + R[i] * w / 2 + pad, top + i / NS * h);
  x.lineTo(cx + R[NS] * w / 2 + pad * 0.7, top + h + pad);
  x.lineTo(cx - R[NS] * w / 2 - pad * 0.7, top + h + pad);
  for (let i = NS; i >= 0; i--) x.lineTo(cx - R[i] * w / 2 - pad, top + i / NS * h);
  x.closePath();
}
function hexMix(a, b, u) { const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16); const ch = s => Math.round(lerp((pa >> s) & 255, (pb >> s) & 255, u)); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; }
const GLASS = {
  green: { base: P.green, dot: P.greenDot, liq: P.cola, liqDot: P.colaDot },
  amber: { base: P.amber, dot: P.amberDot, liq: '#6A3E1D', liqDot: '#1E0F06' },
  aqua: { base: P.aqua, dot: P.aquaDot, liq: '#5B4A35', liqDot: '#17110B' },
  clear: { base: P.clear, dot: P.clearDot, liq: '#5A3A26', liqDot: '#170D07' },
  pod: { base: P.pod, dot: P.podDot, liq: P.pod, liqDot: P.podDot },
};
// draw a vessel into ctx x. o: {R, h, w, glass, liquid, flutes:[[y0,y1]], nFl, cap, capCol, border, label}
function drawVessel(x, o, cx, top) {
  const { R, h, w } = o, gl = o.colors || GLASS[o.glass || 'green'], sp = o.dot || 8;
  const rAt = y => R[clamp(Math.round((y - top) / h * NS), 0, NS)] * w / 2;
  // white paper border + cap border first
  if (o.border) {
    x.save(); x.shadowColor = 'rgba(20,12,4,0.40)'; x.shadowBlur = 16; x.shadowOffsetX = 6; x.shadowOffsetY = 11;
    vPath(x, R, cx, top, h, w, o.border); x.fillStyle = P.white; x.fill();
    if (o.cap) { const cw = R[0] * w * 1.14 + o.border * 2, ch = h * (o.cap === 'screw' ? 0.075 : 0.05) + o.border; x.fillRect(cx - cw / 2, top - ch, cw, ch + 4); }
    x.restore();

  }
}

// 7 — payoff: the lineup, not decoration, a signature you can feel
function scene7(t) {
  bgPaper(NEWS_A, 'rgba(255,240,220,1)', 0.6);

  if (lineOut < 1) {

    });

      marker([[120, 540], [960, 590]], ramp(t, B.deco + 0.42, B.deco + 0.62), { key: 186, w: 12 });

    g.restore();
  }
  // hero + headline
  if (lineOut > 0) {
    const u = eback(ramp(t, B.anti - 0.35, B.anti + 0.2));
    g.save(); g.globalAlpha = 0.9 * lineOut; const bb = burst(520, P.red, 7); g.drawImage(bb, 540 - 520, 1110 - 520); g.restore();
    place(strip(1240, 300, P.ink, 190), 540, 1250, { rot: -0.04, key: 190, alpha: lineOut });
    place(vessel('contour700', V.contour(700)), 540, 1000 + (1 - u) * 900, { rot: 0.03, key: 191 });
    drawRansom(ransom('ANTI-COPYCAT\nDEVICE', 118, 13), 540, 390, t, B.anti - 0.1, { stagger: 0.03, out: en('payoff') + 0.2 });
    const fv = ramp(t, B.feelit - 0.15, B.feelit + 0.1);
    place(strip(560, 104, P.white, 193, { torn: 'lr' }), 540, 1440, { rot: -0.03, key: 193, alpha: fv, scale: lerp(1.2, 1, eout(fv)) });
    markerText('you can feel it.', 540, 1440, 62, ramp(t, B.feelit, B.feelit + 0.5), { key: 193, color: P.red, rot: -0.03 });
  }
  // end card
  const endT = en('payoff') + 0.35;
  if (t > endT) {
    const v = eout(ramp(t, endT, endT + 0.4));
    place(strip(900, 170, P.white, 195, { torn: 'lr' }), 540, 400 + (1 - v) * 40, { rot: -0.02, key: 195, alpha: v });
    g.save(); g.globalAlpha = v; g.translate(540, 400 + (1 - v) * 40); g.rotate(-0.02); g.fillStyle = P.ink; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `italic 900 78px 'Playfair Display'`; g.fillText('The Contour Bottle', 0, -4);
    g.restore();
    kicker('DESIGNED 1915 · STILL IN YOUR HAND', 540, 540, t, endT + 0.25, { key: 7, bg: P.red, fg: P.white, size: 34 });
  }
}

const SCENES = [scene0, scene1, scene2, scene3, scene4, scene5, scene6, scene7];

/* ------------------------------------------------------------------ frame */
function sceneIndex(t) { let i = 0; while (i < BOUNDS.length - 2 && t >= BOUNDS[i + 1]) i++; return i; }
function drawScene(i, t) {
  // gentle push-in per scene
  const a = BOUNDS[i], b = BOUNDS[i + 1], k = 1 + 0.035 * clamp((t - a) / (b - a));
  g.save(); g.translate(540, 1000); g.scale(k, k); g.translate(-540, -1000);
  SCENES[i](t);
  g.restore();
}
function frame(t) {
  TICK = Math.floor(t * 12);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  const i = sceneIndex(t);
  // transition: next sheet slides up over the last with a torn top edge
  const nb = BOUNDS[i + 1], pb = BOUNDS[i];
  let drew = false;
  if (i < SCENES.length - 1 && t > nb - TR_IN) { // upcoming boundary (we are just before it)
    const u = eio(ramp(t, nb - TR_IN, nb + TR_OUT));
    drawScene(i, t); sheet(i + 1, t, u); drew = true;
  } else if (i > 0 && t < pb + TR_OUT) {
    const u = eio(ramp(t, pb - TR_IN, pb + TR_OUT));
    drawScene(i - 1, t); sheet(i, t, u); drew = true;
  }
  if (!drew) drawScene(i, t);
  drawCaption(t);
  // grain + vignette
  g.save(); g.globalCompositeOperation = 'soft-light'; g.globalAlpha = 0.20; g.drawImage(GRAIN[TICK % 4], 0, 0, W, H); g.restore();
  g.save(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.07; g.drawImage(GRAIN[(TICK + 2) % 4], 0, 0, W, H); g.restore();
  const vg = g.createRadialGradient(540, 960, 500, 540, 960, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(40,20,0,0.30)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  return {};
}
function sheet(i, t, u) {
  const off = (1 - u) * (H + 80);
  const r = rng(1000 + i), edge = []; for (let x = -20; x <= W + 20; x += 24) edge.push([x, (r() - 0.5) * 34 + Math.sin(x * 0.01 + i) * 10]);
  // shadow cast by the sheet edge
  g.save(); g.translate(0, off);
  g.beginPath(); edge.forEach((p, k) => k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.lineTo(W + 20, H + 200); g.lineTo(-20, H + 200); g.closePath();
  g.shadowColor = 'rgba(30,15,0,0.5)'; g.shadowBlur = 30; g.shadowOffsetY = -8; g.fillStyle = P.paper; g.fill();
  g.restore();
  g.save(); g.translate(0, off);
  g.beginPath(); edge.forEach((p, k) => k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.lineTo(W + 20, H + 200); g.lineTo(-20, H + 200); g.closePath(); g.clip();
  g.translate(0, -off * 0.0); drawScene(i, t);
  g.restore();
  // torn white fibre lip
  g.save(); g.translate(0, off); g.strokeStyle = 'rgba(250,246,236,0.95)'; g.lineWidth = 7; g.beginPath(); edge.forEach((p, k) => k ? g.lineTo(p[0], p[1] + 2) : g.moveTo(p[0], p[1] + 2)); g.stroke(); g.restore();
}

/* ------------------------------------------------------------------ sound design (one-shots) */
function buildEvents() {
  // typing in the dark
  for (let k = 0; k < 15; k++) ev(0.55 + k * 0.06, 'clack', 0.5, 0.9 + (k % 3) * 0.08);
  ev(B.point - 0.15, 'swish', 1.2); ev(B.point - 0.1, 'whoosh', 0.8);
  for (let k = 0; k < 11; k++) ev(B.point + 0.1 + k * 0.035, 'tick', 0.6);
  for (let i = 1; i < BOUNDS.length - 1; i++) { ev(BOUNDS[i] - 0.25, 'swish', 1.0); ev(BOUNDS[i] - 0.2, 'whoosh', 0.55); }
  // years: letters slapping down
  const years = [[B.y1886 - 0.25, 4], [T.s2 + 0.1, 4], [B.y1915 - 0.3, 4], [T.s5 + 0.05, 4], [B.y1957 - 0.35, 4], [B.y1960 - 0.1, 4], [B.plastic - 0.35, 4]];
  for (const [t0, n] of years) for (let k = 0; k < n; k++) ev(t0 + k * 0.07, 'tick', 0.9, 0.8 + k * 0.05);
  for (let k = 0; k < 12; k++) ev(B.anti - 0.1 + k * 0.03, 'tick', 0.6);
  ev(T.s1 + 0.4, 'pop', 0.6); ev(B.cents, 'ding', 0.9);
  for (let k = 0; k < 6; k++) ev(T.s1 + 1.2 + k * 0.45, 'pop', 0.25, 1.4 + (k % 3) * 0.3); // fizz
  ev(B.nobottle - 0.1, 'swish', 0.7); ev(B.nobottle + 0.06, 'swish', 0.7);
  ev(B.label + 0.25, 'thud', 0.6, 1.6);
  ev(B.ice - 0.1, 'splash', 1.0); ev(B.ice + 0.4, 'drip', 0.6); ev(B.ice + 1.1, 'drip', 0.5, 1.2);
  ev(B.copy, 'whoosh', 0.6); ev(B.koka, 'thud', 0.5, 1.5); ev(B.koka + 0.24, 'thud', 0.5, 1.6);
  ev(B.same + 0.75, 'thud', 1.1);
  // memo typing
  const total = MEMO.join('').length, ts = B.asked - 0.45, te = B.feel - 0.4;
  for (let k = 0; k < total; k += 2) ev(ts + (te - ts) * k / total, 'clack', 0.45, 0.9 + (k % 5) * 0.05);
  ev(te + 0.05, 'ding', 0.6, 1.2);
  ev(B.feel - 0.35, 'click', 1.0, 0.6);
  ev(B.broken, 'crash', 1.0);
  ev(B.dean - 0.1, 'swish', 0.6);
  ev(B.coca - 0.1, 'swish', 0.4); ev(B.coca + 0.35, 'swish', 0.4);
  ev(B.cocoa - 0.3, 'whoosh', 0.8);
  ev(B.wrong, 'thud', 1.2); ev(B.perfect, 'thud', 1.0, 1.15);
  ev(B.perfect + 0.35, 'whoosh', 0.7); ev(B.ribs + 0.25, 'chime', 0.6);
  ev(B.contour - 0.15, 'thud', 1.0);
  ev(B.slim, 'spring', 0.5, 1.3); ev(B.people - 0.2, 'swish', 0.9);
  ev(B.painted - 0.1, 'swish', 0.6); ev(B.painted + 0.4, 'swish', 0.5);
  ev(B.y1960 + 0.35, 'thud', 1.3);
  ev(B.plastic - 0.3, 'whoosh', 0.8);
  ev(B.deco + 0.25, 'swish', 0.8); ev(B.deco + 0.42, 'swish', 0.8);
  ev(B.anti - 0.35, 'whoosh', 0.8);
  ev(en('payoff') + 0.35, 'chime', 0.8);
}

/* ------------------------------------------------------------------ boot */
window.SCENE = { duration: TOTAL };
const FAM = ["400 20px Anton", "900 20px 'Playfair Display'", "italic 900 20px 'Playfair Display'", "400 20px 'Special Elite'", "400 20px UnifrakturMaguntia",
  "400 20px 'Permanent Marker'", "700 20px Oswald", "400 20px 'Old Standard TT'", "700 20px 'Old Standard TT'", "italic 400 20px 'Old Standard TT'",
  "400 20px 'Abril Fatface'", "400 20px 'Courier Prime'", "700 20px 'Courier Prime'"];
Promise.all(FAM.map(f => document.fonts.load(f))).then(() => {
  window.fontsReady = FAM.every(f => document.fonts.check(f));
  init(); buildEvents(); window.EVENTS = EVENTS.sort((a, b) => a.t - b.t);
  window.renderAt = t => { try { return frame(t); } catch (e) { window.SCENE_ERRORS.push(e.stack || String(e)); return {}; } };
  if (!VIDEO) {
    const q = location.search.match(/t=([\d.]+)/); let start = performance.now() - (q ? +q[1] * 1000 : 0), paused = false, pt = 0;
    addEventListener('keydown', e => { if (e.code === 'Space') { paused = !paused; if (!paused) start = performance.now() - pt * 1000; } if (e.key === 'r') start = performance.now(); });
    const loopF = () => { if (!paused) { pt = ((performance.now() - start) / 1000) % TOTAL; window.renderAt(pt); } requestAnimationFrame(loopF); };
    requestAnimationFrame(loopF);
  }
});
